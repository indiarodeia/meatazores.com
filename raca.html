<!doctype html>
<html lang="pt-PT">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Raça | MeatAzores</title>
    <meta name="description" content="Conheça esta raça MeatAzores: origem, território, valor patrimonial, peças e produtores associados." />

    <!-- Não indexar esta página -->
    <meta name="robots" content="noindex,follow" />
    <meta name="googlebot" content="noindex,follow" />

    <!-- Theme / ícones -->
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MeatAzores" />
    <link rel="manifest" href="/assets/favicon/site.webmanifest" />

    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/styleguide.css" />
    <link rel="stylesheet" href="css/style.css" />

    <!-- Vercel Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>

<body>
    <div class="element-producer">

        <!-- Hero -->
        <div class="image-3" id="raca-hero-wrapper">
            <img class="image-4" id="raca-hero" src="" alt="" />
        </div>

        <main class="frame-19">

            <!-- Cabeçalho: imagem, tipo, nome, localização -->
            <header class="header-2">
                <img class="clip-path-group-2" id="raca-imagem" src="" alt="" />

                <div class="frame-20">
                    <p class="produtor-de-carne" id="raca-tipo"></p>
                    <h1 class="text-wrapper-24" id="raca-nome"></h1>

                    <div class="info">
                        <div class="location-wrapper">
                            <div class="location">
                                <div class="hugeicons-eco-power-2">
                                    <img src="assets/ui/localizacao.svg" alt="" />
                                </div>
                                <p class="text-wrapper-25" id="raca-localizacao"></p>
                            </div>
                        </div>
                    </div>
                    <div id="raca-logo-container" hidden></div>
                </div>
            </header>

            <!-- Sobre a raça (descrição curta) -->
            <section class="group-2" aria-labelledby="sec-sobre">
                <div class="frame-21">
                    <h2 id="sec-sobre" class="text-wrapper-26">Sobre a raça</h2>
                    <p class="text-wrapper-27" id="raca-descricao-curta"></p>
                </div>
            </section>

            <!-- Aparência: foto de corpo (pelagem e porte) -->
            <section id="sec-aparencia-secao" class="raca-aparencia" aria-labelledby="sec-aparencia" hidden>
                <h2 id="sec-aparencia" class="raca-aparencia__title">Como reconhecer</h2>
                <div class="raca-aparencia__visual">
                    <img id="raca-corpo" class="raca-aparencia__img" src="" alt="" />
                </div>
            </section>

            <!-- Ficha rápida -->
            <section id="sec-ficha-rapida-secao" class="raca-ficha-rapida" aria-labelledby="sec-ficha-rapida" hidden>
                <h2 id="sec-ficha-rapida" class="raca-ficha-rapida__title">Ficha rápida</h2>
                <div id="raca-ficha-rapida" class="raca-ficha-rapida__grid"></div>
            </section>

            <img class="separator-3" src="assets/ui/separator.svg" alt="" />

            <!-- História / origem -->
            <section id="sec-historia-secao" class="frame-22" aria-labelledby="sec-historia">
                <div class="creators-4">
                    <h2 id="sec-historia" class="text-wrapper-31">História e origem</h2>
                </div>
                <p class="text-wrapper-32" id="raca-historia"></p>
            </section>

            <img class="separator-3" src="assets/ui/separator.svg" alt="" />

            <!-- Características gerais -->
            <section id="sec-caracteristicas-secao" class="frame-22" aria-labelledby="sec-caracteristicas">
                <div class="creators-3">
                    <div class="frame-23">
                        <h2 id="sec-caracteristicas" class="heading-xl">Características</h2>
                    </div>
                </div>
                <ul id="raca-caracteristicas" class="raca-caracteristicas" role="list"></ul>
            </section>

            <img class="separator-3" src="assets/ui/separator.svg" alt="" />

            <!-- Carne e contexto MeatAzores -->
            <section id="sec-contexto-secao" class="frame-22" aria-labelledby="sec-contexto">
                <div class="creators-4">
                    <h2 id="sec-contexto" class="text-wrapper-31">Na MeatAzores</h2>
                </div>
                <p class="text-wrapper-32" id="raca-contexto"></p>
            </section>

            <!-- Nota educativa (opcional) -->
            <aside id="sec-nota-educativa" class="raca-nota-educativa" aria-label="Nota educativa" hidden>
                <span class="raca-nota-educativa__icon" aria-hidden="true">ℹ️</span>
                <p class="raca-nota-educativa__texto" id="raca-nota-educativa"></p>
            </aside>

            <!-- Secções extra (opcional, preenchido por JS — preserva conteúdo de raças existentes) -->
            <div id="raca-secoes-extra"></div>

            <!-- Peças associadas -->
            <section id="sec-pecas-secao" class="content-3" aria-labelledby="sec-pecas">
                <div class="div-4">
                    <div class="frame-26">
                        <h2 id="sec-pecas" class="heading-xl">Peças associadas</h2>
                    </div>
                    <div id="raca-pecas"></div>
                </div>
                <img class="separator-4" src="assets/ui/separator.svg" alt="" />
            </section>

            <!-- Produtores associados -->
            <section id="sec-produtores-secao" class="content-3" aria-labelledby="sec-produtores">
                <div class="div-4">
                    <div class="frame-26">
                        <h2 id="sec-produtores" class="heading-xl">Produtores associados</h2>
                    </div>
                    <div id="raca-produtores"></div>
                </div>
                <img class="separator-4" src="assets/ui/separator.svg" alt="" />
            </section>

            <!-- Galeria -->
            <section id="sec-galeria-secao" class="frame-22" aria-labelledby="sec-galeria">
                <div class="creators-4">
                    <h2 id="sec-galeria" class="text-wrapper-31">Galeria</h2>
                </div>
                <div id="raca-galeria" style="display: flex; flex-wrap: wrap; gap: 8px; width: 100%;"></div>
            </section>

            <!-- Outras raças -->
            <section id="sec-outras-racas-secao" class="outras-racas" aria-labelledby="sec-outras-racas" hidden>
                <div class="outras-racas__header">
                    <h2 id="sec-outras-racas" class="heading-xl">Outras raças</h2>
                    <a href="racas.html" class="outras-racas__ver-todas" aria-label="Ver todas as raças">Ver todas</a>
                </div>
                <div id="raca-outras-racas" class="outras-racas__lista" aria-label="Lista de outras raças"></div>
            </section>

        </main>

        <!-- Barra de ações -->
        <div class="scanning">
            <header class="header" aria-label="Ações">
                <div id="lang-toggle" class="lang-toggle-fixed"></div>
                <a href="index.html" class="button-cancel" aria-label="Fechar">
                    <span class="img-wrapper">
                        <img class="close-square" src="assets/ui/back.svg" alt="" />
                    </span>
                </a>
            </header>
        </div>

    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Imagem ampliada">
        <button class="lightbox__close" aria-label="Fechar imagem">×</button>
        <img class="lightbox__img" src="" alt="" />
    </div>

    <script src="js/utils.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/lightbox.js"></script>
    <script src="js/raca.js"></script>
    <script src="js/nav.js"></script>
</body>

</html>

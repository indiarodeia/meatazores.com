<!doctype html>
<html lang="pt-PT">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Scan | MeatAzores</title>
    <meta name="description" content="Leia o QR Code de uma peça MeatAzores com a câmara do seu telemóvel." />

    <link rel="canonical" href="https://meatazores.com/scan" />
    <link rel="alternate" hreflang="pt-pt" href="https://meatazores.com/scan" />
    <link rel="alternate" hreflang="en" href="https://meatazores.com/scan?lang=en" />
    <link rel="alternate" hreflang="x-default" href="https://meatazores.com/scan" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MeatAzores" />
    <meta property="og:title" content="Scan | MeatAzores" />
    <meta property="og:description" content="Leia o QR Code de uma peça MeatAzores com a câmara do seu telemóvel." />
    <meta property="og:url" content="https://meatazores.com/scan" />
    <meta property="og:image" content="https://meatazores.com/assets/peca/ramo-grande-dop-peter-cafe-sport/bg-ramo-grande-dop-peter.jpg" />
    <meta property="og:locale" content="pt_PT" />
    <meta property="og:locale:alternate" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Scan | MeatAzores" />
    <meta name="twitter:description" content="Leia o QR Code de uma peça MeatAzores com a câmara do seu telemóvel." />
    <meta name="twitter:image" content="https://meatazores.com/assets/peca/ramo-grande-dop-peter-cafe-sport/bg-ramo-grande-dop-peter.jpg" />

    <!-- Preconnect ao CDN do leitor de QR -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <meta name="theme-color" content="#014838" />
    <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MeatAzores" />
    <link rel="manifest" href="/assets/favicon/site.webmanifest" />

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/styleguide.css" />
    <link rel="stylesheet" href="css/style.css" />

    <!-- Vercel Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>

<body>
    <div id="lang-toggle" class="lang-toggle-fixed"></div>
    <main class="app-page scan-page" id="scan-page">
        <header class="app-page__header">
            <img class="app-page__logo" src="assets/ui/logo-meatzores.svg" alt="Logótipo MeatAzores" />
            <h1 class="app-page__title" id="scan-titulo">Scan</h1>
            <p class="app-page__text" id="scan-intro">Aponte a câmara ao QR Code da peça para conhecer a sua origem.</p>
        </header>

        <section class="scan" aria-labelledby="scan-titulo">
            <div id="scan-area" class="scan__area" aria-live="polite">
                <div id="scan-reader" class="scan__reader" hidden></div>
                <div id="scan-placeholder" class="scan__placeholder">
                    <svg class="scan__placeholder-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M6 8V6h2" />
                        <path d="M16 6h2v2" />
                        <path d="M18 16v2h-2" />
                        <path d="M8 18H6v-2" />
                        <path d="M8 12h8" />
                        <path d="M12 8v8" />
                    </svg>
                </div>
            </div>

            <p id="scan-status" class="scan__status" hidden></p>

            <div class="scan__actions">
                <button type="button" id="scan-start" class="app-button">Iniciar scan</button>
                <button type="button" id="scan-stop" class="app-button app-button--ghost" hidden>Parar</button>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/scan.js"></script>
</body>

</html>
